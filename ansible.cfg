# ansible.cfg
# Ansible configuration for comp-hardening.
# This file takes effect for anyone who clones this repo.

[defaults]
inventory           = inventory/hosts.yml
roles_path          = roles
# host_key_checking verifies the SSH host key of every device before
# connecting. Keep this True — setting it False opens you up to
# man-in-the-middle attacks.
host_key_checking   = True
retry_files_enabled = False
stdout_callback     = default
result_format       = yaml
